default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "call_calendar_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "call_calendar_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "call_calendar_production") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_CACHE_NAME", "call_calendar_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_QUEUE_NAME", "call_calendar_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_CABLE_NAME", "call_calendar_production_cable") %>
    migrations_paths: db/cable_migrate
