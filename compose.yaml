services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-call_calendar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-call_calendar}
      POSTGRES_DB: ${DB_NAME:-call_calendar_production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-call_calendar} -d ${DB_NAME:-call_calendar_production}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER:-call_calendar}
      DB_PASSWORD: ${DB_PASSWORD:-call_calendar}
      DB_NAME: ${DB_NAME:-call_calendar_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE before starting the app}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

volumes:
  postgres_data:
